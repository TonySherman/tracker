<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Streak — Habit Tracker</title>
<meta name="description" content="A fast, private, offline-first habit tracker. Build streaks that stick.">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-glow" aria-hidden="true"></div>
  <div class="splash-inner">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/><stop offset=".55" stop-color="#f472b6"/><stop offset="1" stop-color="#fb923c"/>
          </linearGradient>
        </defs>
        <path d="M36.5 4.5c1.6 8.2-1.1 13.2-5.6 17.6-4.9 4.8-11.6 9-13.9 16.6C13.9 49.5 21 59.5 32 59.5s18.5-8 18.5-18.2c0-6.2-2.8-10.9-6.2-14.4-.4 3.3-2 5.6-4.3 6.9 1-8.1-1.3-19.5-13.5-29.3z" fill="url(#mg)"/>
        <path d="M32 52.5c4.6 0 7.9-3.3 7.9-7.6 0-4.6-3.7-7.2-5.6-11.4-2.6 3.3-5 4.4-7.4 7.1-1.6 1.8-2.8 3.6-2.8 6 0 4 3.3 5.9 7.9 5.9z" fill="#0b0b12" fill-opacity=".55"/>
      </svg>
    </div>
    <h1 class="splash-title">Streak</h1>
    <p class="splash-tag">Small things. Every day.</p>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>
</div>

<noscript>
  <div style="padding:2rem;color:#fff;font:16px system-ui">Streak needs JavaScript to run.</div>
</noscript>

<div id="app" class="app" hidden></div>
<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
